# /etc/nginx/sites-available/aems
# Replace aems.example.com with your domain (or EC2 public IP), then:
#   sudo ln -s /etc/nginx/sites-available/aems /etc/nginx/sites-enabled/aems
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d aems.example.com     # adds HTTPS automatically

server {
    listen 80;
    server_name aems.example.com;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}
